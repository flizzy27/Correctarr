# Builds the image and pushes it to GHCR.
#
# Runs on every push to main and on every tag of the form v1.2.3.
# The package has to be set to "public" once in the GitHub settings, otherwise
# Unraid cannot pull it.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Lint
        run: ruff check app/ tests/

      - name: Tests
        run: pytest -q

      - name: No credentials in the tree
        run: |
          if grep -rniE '(api[_-]?key|apikey|password|token)[[:space:]]*[=:][[:space:]]*["'"'"'][A-Za-z0-9_-]{16,}' \
               --exclude-dir=.git --exclude-dir=.github . ; then
            echo "::error::Something that looks like a credential is in the tree."
            exit 1
          fi
          echo "Nothing found."

      - name: No private addresses in the tree
        run: |
          if grep -rnE '\b(192\.168|10\.[0-9]+\.|172\.(1[6-9]|2[0-9]|3[01])\.)[0-9.]+' \
               --exclude-dir=.git --exclude-dir=.github \
               --exclude=README.md --exclude=correctarr.xml . ; then
            echo "::error::A private address is in the tree outside the documented examples."
            exit 1
          fi
          echo "Nothing found."

  build:
    name: Build and push
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Sign in to the registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || format('main-{0}', github.sha) }}
            BUILT_AT=${{ github.event.repository.updated_at }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
