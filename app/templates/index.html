<!DOCTYPE html>
<html lang="en" data-theme="midnight" data-density="normal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex, nofollow">
<title>Correctarr</title>
<link rel="icon" href="static/icon.png" type="image/png">
<link rel="stylesheet" href="static/style.css?v=__V__">
<script>
  /* Apply the palette before the first paint, otherwise the default flashes. */
  try {
    var theme = localStorage.getItem("correctarr.theme");
    var density = localStorage.getItem("correctarr.density");
    if (theme) document.documentElement.dataset.theme = theme;
    if (density) document.documentElement.dataset.density = density;
  } catch (e) { /* private window: keep the default */ }
</script>
<!-- Every module with the version on it. A module's own imports carry no
     query of their own, and without this a browser that has been here before
     would load last month's pages into this month's frame. -->
<script type="importmap">
{
  "imports": {
    "./static/js/api.js": "./static/js/api.js?v=__V__",
    "./static/js/charts.js": "./static/js/charts.js?v=__V__",
    "./static/js/findings.js": "./static/js/findings.js?v=__V__",
    "./static/js/i18n.js": "./static/js/i18n.js?v=__V__",
    "./static/js/state.js": "./static/js/state.js?v=__V__",
    "./static/js/ui.js": "./static/js/ui.js?v=__V__",
    "./static/js/wizard.js": "./static/js/wizard.js?v=__V__",
    "./static/js/pages/activity.js": "./static/js/pages/activity.js?v=__V__",
    "./static/js/pages/downloads.js": "./static/js/pages/downloads.js?v=__V__",
    "./static/js/pages/home.js": "./static/js/pages/home.js?v=__V__",
    "./static/js/pages/indexers.js": "./static/js/pages/indexers.js?v=__V__",
    "./static/js/pages/library.js": "./static/js/pages/library.js?v=__V__",
    "./static/js/pages/profiles.js": "./static/js/pages/profiles.js?v=__V__",
    "./static/js/pages/rules.js": "./static/js/pages/rules.js?v=__V__",
    "./static/js/pages/settings.js": "./static/js/pages/settings.js?v=__V__",
    "./static/js/pages/todo.js": "./static/js/pages/todo.js?v=__V__"
  }
}
</script>
<script type="module" src="static/app.js?v=__V__"></script>
</head>
<body>
<a class="skip-link" href="#main" data-t="nav.skip"></a>

<div class="shell">

  <aside class="sidebar">
    <div class="brand">
      <img class="brand-mark" src="static/icon.png" alt="" width="30" height="30">
      <div>
        <div class="brand-name">Correctarr</div>
        <div class="brand-version" id="version">…</div>
      </div>
    </div>

    <nav class="nav" data-t-aria="nav.menu">
      <a class="nav-item" href="#home" data-target="home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
        <span data-t="nav.home"></span></a>
      <a class="nav-item" href="#todo" data-target="todo">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        <span data-t="nav.todo"></span><span class="nav-count" data-count-todo hidden></span></a>
      <a class="nav-item" href="#activity" data-target="activity">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
        <span data-t="nav.activity"></span></a>
      <a class="nav-item" href="#downloads" data-target="downloads">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
        <span data-t="nav.downloads"></span></a>
      <a class="nav-item" href="#library" data-target="library">
        <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.7 4 3 9 3s9-1.3 9-3V5"/><path d="M3 12c0 1.7 4 3 9 3s9-1.3 9-3"/></svg>
        <span data-t="nav.library"></span></a>

      <div class="nav-group" data-t="nav.group_setup"></div>
      <a class="nav-item" href="#profiles" data-target="profiles">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2.5"/><path d="M10 9l5 3-5 3z"/></svg>
        <span data-t="nav.profiles"></span></a>
      <a class="nav-item" href="#rules" data-target="rules">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>
        <span data-t="nav.rules"></span></a>
      <a class="nav-item" href="#indexers" data-target="indexers">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20V10M18 20V4M6 20v-4"/></svg>
        <span data-t="nav.indexers"></span></a>
      <a class="nav-item" href="#settings" data-target="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        <span data-t="nav.settings"></span></a>
    </nav>

    <div class="sidebar-footer">
      <span class="dot" id="heartbeat"></span>
      <span class="user" id="user">…</span>
      <button class="btn small ghost" data-sign-out data-t="action.sign_out" hidden></button>
    </div>
  </aside>

  <div class="content">
    <header class="topbar">
      <div class="topbar-title">
        <h1 id="title">Correctarr</h1>
        <p id="subtitle"></p>
      </div>
      <div class="topbar-actions">
        <a class="pill warn" id="dry-run-badge" href="#settings?tab=behaviour" hidden>
          <span class="pill-dot" aria-hidden="true"></span><span data-t="topbar.dry_run"></span></a>
        <button class="btn" id="open-wizard" data-t="wizard.open" hidden></button>
        <details class="menu" id="check-menu">
          <summary class="btn primary"><span data-t="topbar.check"></span></summary>
          <div class="menu-list" role="menu">
            <button type="button" role="menuitem" id="check-fast">
              <strong data-t="action.check_fast"></strong><span data-t="topbar.check_fast_help"></span></button>
            <button type="button" role="menuitem" id="check-deep">
              <strong data-t="action.check_deep"></strong><span data-t="topbar.check_deep_help"></span></button>
          </div>
        </details>
      </div>
    </header>

    <!-- On every page while the safety fuse holds automatic actions: a quiet
         program and a stopped one look exactly alike otherwise. -->
    <div class="banner bad" id="safety-banner" role="alert" hidden>
      <div class="banner-text">
        <strong data-t="safety.banner_title"></strong>
        <span id="safety-reason"></span>
        <span class="muted" data-t="safety.banner_help"></span>
      </div>
      <button class="btn primary" id="safety-resume" data-t="safety.resume"></button>
    </div>

    <main id="main" tabindex="-1">
      <section id="page-home" class="page" hidden></section>
      <section id="page-todo" class="page" hidden></section>
      <section id="page-activity" class="page" hidden></section>
      <section id="page-downloads" class="page" hidden></section>
      <section id="page-library" class="page" hidden></section>
      <section id="page-profiles" class="page" hidden></section>
      <section id="page-rules" class="page" hidden></section>
      <section id="page-indexers" class="page" hidden></section>
      <section id="page-settings" class="page" hidden></section>
    </main>
  </div>
</div>

<!-- On a phone the four places visited most sit under the thumb; the rest
     are one press away in the sheet. -->
<nav class="tabbar" data-t-aria="nav.menu">
  <a class="nav-item" href="#home" data-target="home">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
    <span data-t="nav.home"></span></a>
  <a class="nav-item" href="#todo" data-target="todo">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
    <span data-t="nav.todo"></span><span class="nav-count" data-count-todo hidden></span></a>
  <a class="nav-item" href="#activity" data-target="activity">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
    <span data-t="nav.activity"></span></a>
  <a class="nav-item" href="#downloads" data-target="downloads">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
    <span data-t="nav.downloads"></span></a>
  <button type="button" class="nav-item" id="more-open" aria-haspopup="dialog">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>
    <span data-t="nav.more"></span></button>
</nav>

<dialog class="sheet" id="more-sheet" data-t-aria="nav.more">
  <div class="sheet-grip" aria-hidden="true"></div>
  <a class="nav-item" href="#library" data-target="library"><span data-t="nav.library"></span></a>
  <a class="nav-item" href="#profiles" data-target="profiles"><span data-t="nav.profiles"></span></a>
  <a class="nav-item" href="#rules" data-target="rules"><span data-t="nav.rules"></span></a>
  <a class="nav-item" href="#indexers" data-target="indexers"><span data-t="nav.indexers"></span></a>
  <a class="nav-item" href="#settings" data-target="settings"><span data-t="nav.settings"></span></a>
  <button class="btn ghost" data-sign-out data-t="action.sign_out" hidden></button>
</dialog>

<dialog class="modal wide wizard" id="wizard" aria-labelledby="wizard-title">
  <div class="modal-inner">
    <header class="modal-head">
      <div>
        <h2 id="wizard-title"></h2>
        <p class="muted" id="wizard-lead"></p>
      </div>
      <button type="button" class="btn icon ghost" id="wizard-close" data-t-aria="action.close">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </header>
    <ol class="steps" id="wizard-steps"></ol>
    <div class="modal-body" id="wizard-body"></div>
    <footer class="modal-foot">
      <button type="button" class="btn ghost" id="wizard-back" data-t="wizard.back"></button>
      <span class="spacer"></span>
      <button type="button" class="btn ghost" id="wizard-skip" data-t="wizard.skip"></button>
      <button type="button" class="btn primary" id="wizard-next"></button>
    </footer>
  </div>
</dialog>

<div id="toasts" aria-live="polite"></div>
</body>
</html>
