[project]
name = "correctarr"
description = "Finds and fixes problems in Radarr, Sonarr, SABnzbd and Prowlarr"
requires-python = ">=3.12"
license = { text = "MIT" }

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", ".lokal", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
ignore = [
  # The interface and the rules live on long explanations in strings.
  # Wrapping them makes them harder to read, not easier.
  "E501",
  # Lambdas as shorthand for lookups are intended here.
  "E731",
  # A broad except is wanted in the rules: a single rule must never take the
  # whole pass down.
  "B904",
  # Depends(...) as a default value is how FastAPI is meant to be used.
  "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Without this, "pytest" only finds the package when it happens to be invoked
# as "python -m pytest", which puts the working directory on the path. The bare
# command does not, so the build failed while every local run passed.
pythonpath = ["."]
addopts = "-q --strict-markers"
# Our own deprecation warnings fail the run; the ones third party libraries
# emit about each other do not. Turning every DeprecationWarning into an error
# means an unrelated library release can break the build overnight.
filterwarnings = [
  "default",
  "error::DeprecationWarning:app",
  "error::DeprecationWarning:tests",
]
